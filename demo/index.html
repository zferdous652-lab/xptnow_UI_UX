<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XPTNOW Bond Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: login portal, then an app shell (collapsible navy sidebar + white workspace). Single light theme by choice: white and navy blue. */
:root{
  --bg:#F5F7FB; --surface:#FFFFFF; --surface-2:#F1F4FA; --ink:#0B1735; --muted:#5A6580; --line:#E1E6EF;
  --brand:#1B3A8C; --brand-2:#2A4FB0; --brand-soft:#E8EDF8; --on-brand:#FFFFFF;
  --navy:#0F1E45; --navy-2:#162A5C; --navy-ink:#FFFFFF; --navy-muted:#A9B5D3; --navy-line:rgba(255,255,255,.1);
  --ok:#0F7A47; --ok-soft:#E2F4EA; --warn:#9A5B00; --warn-soft:#FFF1D9; --bad:#B4302A; --bad-soft:#FDE6E4;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px; --sbw:252px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--navy)}
h1,h2,h3,h4{margin:0;letter-spacing:-0.015em;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
svg.i{width:20px;height:20px;flex:none}
.mark{font-weight:900;letter-spacing:-0.05em;line-height:1;font-size:24px;color:var(--ink)}
.mark .x{color:var(--brand)}
.mark.light{color:#fff}.mark.light .x{color:#B9C8F0}

/* Buttons & chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--brand);color:var(--on-brand);font-size:14px;transition:background .15s}
.btn:hover{background:var(--brand-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--surface);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.blue{background:var(--brand-soft);color:var(--brand)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}
.login-l{background:linear-gradient(160deg,var(--navy),var(--navy-2));color:var(--navy-ink);padding-block:48px;padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:48px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.login-l h1{font-size:clamp(28px,3.4vw,42px);line-height:1.08;font-weight:800;margin-top:28px;max-width:16ch}
.login-l p{color:var(--navy-muted);margin-top:14px;max-width:44ch;font-size:15.5px}
.steps3{display:grid;gap:10px;max-width:420px}
.steps3 div{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.06);border:1px solid var(--navy-line);border-radius:12px;padding:12px 14px;font-size:14px}
.steps3 b{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:12px;flex:none}
.login-r{display:grid;place-items:center;padding-block:40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));background:var(--surface)}
.lcard{width:100%;max-width:440px;display:grid;gap:20px}
.lcard h2{font-size:26px;font-weight:800}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rolec{border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 12px;text-align:left;cursor:pointer;display:grid;gap:8px;align-content:start}
.rolec:hover{border-color:var(--brand-2)}
.rolec[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.rolec .ic{width:34px;height:34px;border-radius:9px;background:var(--surface-2);color:var(--brand);display:grid;place-items:center}
.rolec[aria-pressed="true"] .ic{background:var(--brand);color:#fff}
.rolec b{font-size:14px}
.rolec span{font-size:12px;color:var(--muted);line-height:1.35}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600}
.in{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea.in{min-height:84px;resize:vertical}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(11,23,53,.12)}
.note{font-size:12.5px;color:var(--muted)}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .2s}
.app.collapsed{--sbw:76px}
.sb{position:sticky;top:0;height:100vh;background:var(--navy);color:var(--navy-ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);z-index:40;overflow:hidden}
.sb-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:18px 16px 14px 20px;min-height:64px}
.app.collapsed .sb-top{padding-inline:0;justify-content:center}
.app.collapsed .sb-top .mark{display:none}
.iconbtn{width:36px;height:36px;border-radius:9px;border:0;background:transparent;color:inherit;display:grid;place-items:center;cursor:pointer;flex:none}
.sb .iconbtn:hover{background:rgba(255,255,255,.08)}
.sb .iconbtn svg{transition:transform .2s}
.app.collapsed .sb-top .iconbtn svg{transform:rotate(180deg)}
.who{margin:0 12px 10px;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);display:flex;gap:10px;align-items:center;min-width:0}
.av{width:34px;height:34px;border-radius:50%;background:#2A4FB0;color:#fff;display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none}
.who .t{min-width:0}
.who b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12px;color:var(--navy-muted);white-space:nowrap}
.app.collapsed .who{margin-inline:8px;padding:8px;justify-content:center}
.app.collapsed .who .t{display:none}
.nav{flex:1;overflow-y:auto;padding:4px 12px 12px;display:grid;align-content:start;gap:2px}
.app.collapsed .nav{padding-inline:8px}
.sec{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;color:var(--navy-muted);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:14px 10px 6px;cursor:pointer}
.sec svg{width:14px;height:14px;transition:transform .2s}
.sec[aria-expanded="false"] svg{transform:rotate(-90deg)}
.app.collapsed .sec{justify-content:center;padding:10px 0 4px}
.app.collapsed .sec span,.app.collapsed .sec svg{display:none}
.app.collapsed .sec::after{content:"";width:20px;height:1px;background:var(--navy-line)}
.ni{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:#DCE3F4;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;text-align:left;position:relative}
.ni:hover{background:rgba(255,255,255,.07);color:#fff}
.ni[aria-current="page"]{background:#fff;color:var(--navy)}
.ni .l{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni .bd{min-width:20px;height:20px;border-radius:999px;background:#E2A23B;color:#1B1300;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 6px}
.app.collapsed .ni{justify-content:center;padding:10px 0}
.app.collapsed .ni .l{display:none}
.app.collapsed .ni .bd{position:absolute;top:4px;right:6px;min-width:16px;height:16px;font-size:10px;padding:0 4px}
.sb-foot{padding:12px;border-top:1px solid var(--navy-line);padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.app.collapsed .sb-foot{padding-inline:8px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));min-height:64px}
.top .menu{display:none}
.crumb{flex:1;min-width:0}
.crumb small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.crumb h1{font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-r{display:flex;align-items:center;gap:8px;position:relative}
.demo-pill{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px}
.bell{position:relative;border:1px solid var(--line);background:var(--surface)}
.bell .dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:999px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.userbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 3px;cursor:pointer;font-weight:600;font-size:13px}
.userbtn .av{width:30px;height:30px;font-size:11px}
.pop{position:absolute;top:calc(100% + 8px);right:0;width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(11,23,53,.16);padding:8px;z-index:50;display:grid;gap:2px}
.pop h4{font-size:13px;padding:8px 10px 4px}
.pop .row-i{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;font-size:13.5px;border:0;background:none;text-align:left;width:100%;cursor:pointer}
.pop .row-i:hover{background:var(--surface-2)}
.pop .row-i small{display:block;color:var(--muted);font-size:12px}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.pop .unread{width:8px;height:8px;border-radius:50%;background:var(--brand);margin-top:6px;flex:none}
.pop .read{width:8px;height:8px;flex:none}
.content{padding-block:24px 48px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:18px;align-content:start;max-width:1240px;width:100%}
.scrim{display:none}

/* Cards & layout */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px;min-width:0;align-content:start}
.card h3{font-size:16.5px;font-weight:700}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.split-main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:grid;gap:18px;min-width:0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:4px}
.stat b{font-size:22px;font-weight:700}
.stat small{color:var(--muted);font-size:12.5px}
.hello{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;border-radius:var(--r);padding:24px;display:flex;gap:20px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.hello h2{font-size:22px;font-weight:800}
.hello p{color:var(--navy-muted);margin-top:4px}
.hello .btn{background:#fff;color:var(--navy)}
.shield{display:flex;gap:14px;align-items:flex-start;background:var(--brand-soft);border-radius:12px;padding:14px}
.shield .ic{width:38px;height:38px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.next{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:13.5px}
.empty{text-align:center;padding:32px 20px;display:grid;gap:8px;justify-items:center;color:var(--muted)}
.empty .ic{width:48px;height:48px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;color:var(--brand)}
.empty b{color:var(--ink);font-size:15px}
.kv{display:grid;gap:0;margin:0}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.kv div:first-child{border-top:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;text-align:right}
.photos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ph{border:1.5px dashed var(--line);border-radius:12px;padding:10px;display:grid;gap:6px;background:var(--surface-2);text-align:left;cursor:pointer}
.ph:disabled{cursor:default}
.ph .img{aspect-ratio:4/3;max-width:100%;border-radius:8px;background:repeating-linear-gradient(135deg,var(--line) 0 6px,transparent 6px 12px);display:grid;place-items:center;font-size:12px;color:var(--muted);font-weight:600}
.ph.on{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.ph.on .img{background:linear-gradient(135deg,#BFD9CB,#C9D3EE);color:var(--ink)}
.ph b{font-size:12.5px}
.ai{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:12px 14px;font-size:13.5px}
.ai.warn{background:var(--warn-soft)}
.ai.ok{background:var(--ok-soft)}
.ai .badge{flex:none;font-size:10px;font-weight:800;letter-spacing:.1em;border:1px solid currentColor;border-radius:6px;padding:2px 6px;margin-top:2px}
.ai.warn .badge{color:var(--warn)} .ai.ok .badge{color:var(--ok)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sides{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.side{background:var(--surface-2);border-radius:12px;padding:14px;display:grid;gap:6px;align-content:start}
.split{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.split i{display:block;height:100%}
.legend{display:grid;gap:6px;font-size:13.5px}
.legend div{display:flex;justify-content:space-between;gap:10px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}

/* Table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.live td{background:color-mix(in srgb,var(--brand-soft) 45%,transparent)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--surface);min-width:0;flex:1;max-width:320px;color:var(--muted)}
.search input{border:0;outline:0;padding:9px 0;width:100%;background:none;color:var(--ink)}
.yes{color:var(--ok);font-weight:800}
.no{color:#B8C0D2}

/* Timeline */
.tl{list-style:none;margin:0;padding:0;display:grid}
.tl li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.tl li:last-child{padding-bottom:0}
.tl li:not(:last-child)::before{content:"";position:absolute;left:8px;top:20px;bottom:2px;width:2px;background:var(--line)}
.tl li.done:not(:last-child)::before{background:var(--brand)}
.tl .d{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--surface);margin-top:2px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff}
.tl li.done .d{background:var(--brand);border-color:var(--brand)}
.tl li.now .d{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.tl li.opt .d{border-style:dashed}
.tl .c{display:grid;gap:1px;min-width:0}
.tl .w{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.tl b{font-size:14px;font-weight:600}
.tl li.up b,.tl li.opt b{color:var(--muted);font-weight:500}
.tl small{font-size:12.5px;color:var(--muted)}
.you{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;background:var(--brand-soft);color:var(--brand);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:1px;font-family:var(--f-body)}
.nowtag{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--brand);margin-left:6px}

details.faq{border:1px solid var(--line);border-radius:12px;padding:0 16px;background:var(--surface)}
details.faq summary{cursor:pointer;font-weight:600;padding:14px 0;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"+";color:var(--brand);font-weight:800}
details.faq[open] summary::after{content:"–"}
details.faq p{padding-bottom:14px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:80;box-shadow:0 12px 30px rgba(11,23,53,.3);max-width:calc(100vw - 32px)}

@media (max-width:1100px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .split-main{grid-template-columns:1fr} }
@media (max-width:900px){
  .login{grid-template-columns:1fr}
  .login-l{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:24px;padding-block:32px}
  .login-l .steps3{display:none}
  .app,.app.collapsed{grid-template-columns:minmax(0,1fr)}
  .sb{position:fixed;left:0;top:0;bottom:0;width:272px;height:auto;transform:translateX(-100%);transition:transform .22s}
  .app.drawer .sb{transform:none}
  .app.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(11,23,53,.45);z-index:35}
  .app.collapsed .sb-top{padding:18px 16px 14px 20px;justify-content:space-between}
  .app.collapsed .sb-top .mark{display:block}
  .app.collapsed .who{margin:0 12px 10px;padding:12px;justify-content:flex-start}
  .app.collapsed .who .t{display:block}
  .app.collapsed .sec{justify-content:space-between;padding:14px 10px 6px}
  .app.collapsed .sec span,.app.collapsed .sec svg{display:inline}
  .app.collapsed .sec::after{display:none}
  .app.collapsed .ni{justify-content:flex-start;padding:10px 12px}
  .app.collapsed .ni .l{display:inline}
  .app.collapsed .nav{padding-inline:12px}
  .top .menu{display:grid}
  .sb .collapse{display:none}
  .g2,.sides{grid-template-columns:1fr}
  .photos{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top-in,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .demo-pill{display:none}
  .userbtn .nm{display:none}
}
@media (max-width:560px){ .roles{grid-template-columns:1fr} .g4{grid-template-columns:1fr 1fr} .card{padding:16px} .stat b{font-size:18px} }

<script>
(function(){

const fmt = n => Number(n).toLocaleString('en-MY');
const fmtDate = s => { const d = new Date(s+'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Icons ---------- */
const P = {

const ic = (n, cls='i') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]||''}</svg>`;

/* ---------- RBAC config ---------- */
const PEOPLE = {
  customer:{name:'Aina Rahman', role:'Customer', ini:'AR', email:'aina.rahman@mail.com'},
  contractor:{name:'Sinar Jaya Renovation', role:'Contractor', ini:'SJ', email:'ops@sinarjaya.my'},
  developer:{name:'Farid Hassan', role:'Developer', ini:'FH', email:'farid@tamanmelur.my'},

};
const PORTAL = {customer:'Customer portal', contractor:'Contractor portal', developer:'Service Provider portal', reviewer:'Service Provider portal'};
const NAV = {
  customer:[
    {sec:'My home', items:[{id:'home',label:'Home',icon:'home'},{id:'report',label:'Report an issue',icon:'plus'},{id:'repairs',label:'My repairs',icon:'list',badge:()=>J.stage==='inspected'?1:0}]},
    {sec:'Support', items:[{id:'help',label:'Help & FAQ',icon:'help'}]}
  ],
  contractor:[
    {sec:'Work', items:[{id:'home',label:'Home',icon:'home'},{id:'offers',label:'Job offers',icon:'inbox',badge:()=>J.stage==='assigned'?1:0},{id:'jobs',label:'Active jobs',icon:'brief',badge:()=>(J.stage==='bonded'||(J.stage==='disputed'&&!J.reply))?1:0}]},
    {sec:'Money', items:[{id:'wallet',label:'XPT wallet',icon:'wallet'}]}
  ],
  developer:[
    {sec:'Overview', items:[{id:'home',label:'Overview',icon:'grid'}]},
    {sec:'Work', items:[{id:'reports',label:'Customer reports',icon:'inbox',badge:()=>J.stage==='reported'?1:0},{id:'jobs',label:'Jobs',icon:'list'},{id:'inspections',label:'Inspections',icon:'check',badge:()=>J.stage==='completed'?1:0}]},

  ],

  ]
};
const PERMS = [
  ['Report an issue in their unit',['customer']],
  ['Confirm a repair or raise a concern',['customer']],
  ['See job offers and lock an XPT bond',['contractor']],
  ['Upload completion photos',['contractor']],
  ['Reply to a dispute',['contractor']],
  ['Create work orders and assign contractors',['developer']],
  ['Inspect, accept or dispute work',['developer']],
  ['See all jobs in the project',['developer','reviewer']],
  ['Decide disputes and deductions',['reviewer']],
  ['View roles and permissions',['developer','reviewer']]
];

/* ---------- Demo state ---------- */
const STAGE = {
  none:{label:'No open repair',chip:''},
  reported:{label:'New report',chip:'blue',owner:'developer',next:'The developer creates a work order and assigns a contractor.'},
  assigned:{label:'Awaiting bond',chip:'warn',owner:'contractor',next:'The contractor accepts the job and locks the XPT bond.'},
  bonded:{label:'Repair in progress',chip:'blue',owner:'contractor',next:'The contractor finishes the repair and uploads proof.'},
  completed:{label:'Awaiting inspection',chip:'blue',owner:'developer',next:'The developer inspects the work.'},
  inspected:{label:'Awaiting customer',chip:'blue',owner:'customer',next:'The customer confirms they are happy with the repair.'},
  disputed:{label:'In dispute',chip:'bad',owner:'reviewer',next:'The reviewer looks at every side and decides.'},
  released:{label:'Bond released',chip:'ok',owner:null,next:'Job closed. The bond is settled.'}
};
const SEEDS = [
  {id:'WO-24802', unit:'C-08-11', issue:'Wall crack, living room', con:'Kilat Builders', bond:1000, stage:'bonded'},
  {id:'WO-24790', unit:'A-05-01', issue:'Window seal leak', con:'Sinar Jaya Renovation', bond:800, stage:'released'},
  {id:'WO-24771', unit:'B-03-07', issue:'Door misaligned', con:'Kilat Builders', bond:500, stage:'released'}
];
let S, J, W, EVENTS, clock;
function reset(){
  clock = 9*60;
  const collapsed = S ? S.collapsed : false;
  S = {screen:'login', loginRole:'customer', spRole:'developer', role:null, view:'home', collapsed, drawer:false, pop:null, secs:{}, seen:{}, detail:false, filter:'all', q:'', disputeOpen:false, concernOpen:false, rPhotos:{p1:true,p2:false}};
  try{ if(localStorage.getItem('xpt-sb')==='1') S.collapsed = true; }catch(e){}
  J = {stage:'none', id:'WO-24817', unit:'B-12-03', area:'Bathroom', issue:'Water leaking through bathroom floor', desc:'', contractor:'Sinar Jaya Renovation', amount:1500, deadline:'2026-12-05',
       ev:{after:false, ponding:false, signoff:false}, dispute:null, reply:null, ded:0, t:{}};
  W = {available:3500, locked:0, reuse:4, tx:[['Oct 2026','Bond returned · WO-24702','+1,500'],['Sep 2026','Bond returned · WO-24655','+1,500'],['Aug 2026','Bond returned · WO-24610','+1,200']]};
  EVENTS = [];
}
function tick(){ clock += 9 + Math.floor(Math.random()*35); return String(Math.floor(clock/60)%24).padStart(2,'0')+':'+String(clock%60).padStart(2,'0'); }
function event(text, to, key){ const t = tick(); if(key) J.t[key]=t; EVENTS.unshift({t, text, to}); }
let toastTimer;
function toast(msg){ let el=$('toast'); if(!el){ el=document.createElement('div'); el.id='toast'; el.className='toast'; el.setAttribute('role','status'); document.body.appendChild(el);} el.textContent=msg; el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.hidden=true,2600); }

/* ---------- Shared pieces ---------- */
const chip = st => `<span class="chip ${STAGE[st].chip}">${STAGE[st].label}</span>`;
const empty = (icon, title, text) => `<div class="empty"><div class="ic">${ic(icon)}</div><b>${title}</b><p>${text}</p></div>`;
function photoTiles(list, editable, attr){ return `<div class="photos">${list.map(p=>`<button type="button" class="ph ${p.on?'on':''}" ${editable&&!p.lock?`data-${attr}="${p.id}"`:'disabled'} aria-pressed="${p.on}"><div class="img">${p.on?'✓ Added':editable?'+ Add photo':'Not yet'}</div><b>${p.t}</b></button>`).join('')}</div>`; }
function splitHtml(){ const ret=J.amount-J.ded; return `<div class="split" aria-hidden="true"><i style="width:${ret/J.amount*100}%;background:var(--ok)"></i><i style="width:${J.ded/J.amount*100}%;background:var(--warn)"></i></div>
  <div class="legend"><div><span><i class="sw" style="background:var(--ok)"></i>Returned to contractor</span><b class="num">${fmt(ret)} XPT</b></div>${J.ded?`<div><span><i class="sw" style="background:var(--warn)"></i>Deducted for rework</span><b class="num">${fmt(J.ded)} XPT</b></div>`:''}</div>`; }
function nextBox(){ const st=STAGE[J.stage]; if(!st.owner) return ''; const me = S.role===st.owner; return `<div class="next"><span>${me?'<b>Your turn.</b> ':''}${st.next}</span><span class="chip ${me?'blue':''}">Waiting on: ${PEOPLE[st.owner].role}</span></div>`; }

function timeline(){
  const me = PEOPLE[S.role].role, dl=fmtDate(J.deadline), t=J.t, d=J.dispute;
  const steps = [
    {who:'Customer', k:'reported', title:'Issue reported', sub:`${J.area}: ${J.issue}`},
    {who:'Developer', k:'assigned', title:'Work order created', sub:`${J.contractor} assigned. ${fmt(J.amount)} XPT bond required.`},
    {who:'Contractor', k:'bonded', title:'Bond locked', sub:`${fmt(J.amount)} XPT held until ${dl}`},
    {who:'Contractor', k:'completed', title:'Repair completed', sub:'After photo and ponding test uploaded'}
  ];
  const dsteps = d ? [
    {who:d.by==='customer'?'Customer':'Developer', k:'disputed', title:d.by==='customer'?'Concern raised':'Inspection disputed', sub:d.reason},
    {who:'Contractor', k:'reply', title:J.reply?'Contractor replied':'Contractor reply', sub:J.reply?`"${J.reply}"`:'Optional: gives their side', opt:true},
    {who:'Reviewer', k:'decided', title:t.decided?(J.ded?`Approved ${fmt(J.ded)} XPT deduction`:'Dispute rejected'):'Reviewer decides', sub:t.decided?'Decision is final':'Looks at every side'}
  ] : [];
  if(d && d.by==='developer'){ steps.push(...dsteps); }
  else {
    steps.push({who:'Developer', k:'inspected', title:'Inspection passed', sub:'Evidence complete'});
    if(d) steps.push(...dsteps); else steps.push({who:'Customer', k:'confirmed', title:'Customer confirmation', sub:'Customer confirms they are happy'});
  }
  steps.push({who:'System', k:'released', title:t.released?`Released ${fmt(J.amount-J.ded)} XPT to contractor`:'Bond released', sub:t.released?(J.ded?`${fmt(J.ded)} XPT deducted for rework`:'Bond ready to reuse'):'Full return, or minus an agreed deduction'});
  let nowSet = J.stage==='none' || J.stage==='released';
  return `<ol class="tl">${steps.map(s=>{
    let cls;
    if(t[s.k]) cls='done';
    else if(s.opt) cls='opt';
    else if(!nowSet){ cls='now'; nowSet=true; }
    else cls='up';
    const w = [t[s.k], s.who].filter(Boolean).join(' · ');
    return `<li class="${cls}"><span class="d">${cls==='done'?'✓':''}</span><div class="c"><span class="w">${w}${s.who===me?'<span class="you">YOU</span>':''}</span><b>${s.title}${cls==='now'?'<span class="nowtag">NOW</span>':''}</b><small>${esc(s.sub)}</small></div></li>`;
  }).join('')}</ol>`;
}
function jobCard(title){
  return `<div class="card"><div class="card-h"><h3>${title||'Job timeline'}</h3>${J.stage!=='none'?chip(J.stage):''}</div>${J.stage==='none'?empty('list','No repair yet','The timeline starts when the customer reports an issue.'):timeline()}</div>`;
}
const pre = () => ['none','reported'].includes(J.stage);
function jobFacts(){
  return `<dl class="kv">
    <div><dt>Work order</dt><dd class="num">${J.id}</dd></div>
    <div><dt>Unit</dt><dd>${J.unit}, Residensi Taman Melur</dd></div>

    <div><dt>Contractor</dt><dd>${pre()?'Not assigned':J.contractor}</dd></div>
    <div><dt>Bond</dt><dd class="num">${pre()?'—':fmt(J.amount)+' XPT'}</dd></div>
    <div><dt>Deadline</dt><dd>${pre()?'—':fmtDate(J.deadline)}</dd></div>
    <div><dt>Reviewer</dt><dd>Nur Aisyah, Pegasuswork</dd></div>
  </dl>`;
}

/* ---------- Views: Customer ---------- */
const V = {customer:{}, contractor:{}, developer:{}, reviewer:{}};
V.customer.home = () => `
  <div class="hello"><div><h2>Hi Aina</h2><p>Unit B-12-03, Residensi Taman Melur</p></div>${J.stage==='none'||J.stage==='released'?`<button class="btn" data-nav="report">${ic('plus')}Report an issue</button>`:''}</div>
  <div class="split-main">
    <div class="stack">
      <div class="card"><div class="card-h"><h3>Current repair</h3>${J.stage!=='none'?chip(J.stage):''}</div>

        : `<p><b>${J.area}:</b> ${esc(J.issue)}</p>${nextBox()}<div class="row"><button class="btn ghost sm" data-nav="repairs">View repair details</button></div>`}
      </div>
      ${['bonded','completed','inspected','disputed'].includes(J.stage) ? `<div class="shield"><div class="ic">${ic('shield')}</div><div><b>This repair is protected by a ${fmt(J.amount)} XPT bond.</b><p class="muted" style="margin-top:2px">The contractor locked it before starting. It is only returned once the work passes inspection and you confirm you are happy.</p></div></div>`:''}
      ${J.stage==='released' ? `<div class="shield" style="background:var(--ok-soft)"><div class="ic" style="background:var(--ok)">${ic('check')}</div><div><b>Repair closed.</b><p class="muted" style="margin-top:2px">The contractor's bond has been settled.</p></div></div>`:''}
    </div>
    <div class="card"><h3>My unit</h3><dl class="kv"><div><dt>Unit</dt><dd>B-12-03</dd></div><div><dt>Development</dt><dd>Residensi Taman Melur</dd></div><div><dt>Defect liability period</dt><dd>Until Mar 2027</dd></div><div><dt>Past repairs</dt><dd>1 closed</dd></div></dl></div>
  </div>`;
V.customer.report = () => (J.stage!=='none' && J.stage!=='released') ? `<div class="card">${empty('list','You already have an open repair','Follow its progress under My repairs.')}<div class="row" style="justify-content:center"><button class="btn" data-nav="repairs">Go to My repairs</button></div></div>` : `
  <div class="split-main"><div class="card">
    <h3>Tell us what needs fixing</h3>
    <div class="g2">
      <div class="field"><label for="f-area">Where is it?</label><select class="in" id="f-area">${['Bathroom','Kitchen','Bedroom','Living room'].map(a=>`<option>${a}</option>`).join('')}</select></div>
      <div class="field"><label for="f-type">What kind of issue?</label><select class="in" id="f-type">${['Water leaking through bathroom floor','Cracked tiles','Blocked drain','Wall dampness'].map(a=>`<option>${a}</option>`).join('')}</select></div>
    </div>

    <div class="field"><label>Photos</label>${photoTiles([{id:'p1',t:'Wet floor',on:S.rPhotos.p1},{id:'p2',t:'Ceiling below',on:S.rPhotos.p2}],true,'rp')}</div>
    <div class="row"><button class="btn" data-act="submitReport">Submit report</button><span class="note">The developer is notified straight away.</span></div>
  </div>
  <div class="card"><h3>What happens next</h3><ol class="tl">
    ${[['Developer reviews your report','Usually within 1 working day'],['A contractor is assigned','They lock an XPT bond before starting'],['Repair and inspection','Photos and a water test are checked'],['You confirm','The bond is released only after you are happy']].map((s,i)=>`<li class="${i===0?'now':'up'}"><span class="d"></span><div class="c"><b>${s[0]}</b><small>${s[1]}</small></div></li>`).join('')}
  </ol></div></div>`;
V.customer.repairs = () => `
  <div class="split-main">
    <div class="stack">
      ${J.stage==='none' ? `<div class="card">${empty('list','No open repairs','Report an issue and it will appear here with a live timeline.')}<div class="row" style="justify-content:center"><button class="btn" data-nav="report">Report an issue</button></div></div>` : `
      <div class="card"><div class="card-h"><h3>${J.area}: ${esc(J.issue)}</h3>${chip(J.stage)}</div>${nextBox()}
        ${J.stage==='inspected' ? `<div class="shield"><div class="ic">${ic('check')}</div><div style="display:grid;gap:10px;flex:1;min-width:0"><div><b>The repair passed inspection.</b><p class="muted">Are you happy with the work? The contractor's bond is released when you confirm.</p></div>
          ${photoTiles([{id:'a',t:'After photo',on:true},{id:'b',t:'Ponding test',on:true}],false)}
          <div class="row"><button class="btn" data-act="confirm">Yes, I'm happy</button><button class="btn danger" data-act="toggleConcern">Raise a concern</button></div>
          ${S.concernOpen?`<div class="field"><label for="f-concern">What is still wrong?</label><select class="in" id="f-concern"><option>Floor is still damp near the drain</option><option>Tiles are uneven</option><option>Mess left behind</option></select></div><div class="row"><button class="btn" data-act="sendConcern">Send to reviewer</button><span class="note">A neutral reviewer from Pegasuswork will decide.</span></div>`:''}
        </div></div>`:''}
        ${J.stage==='released'?splitHtml():''}
      </div>`}
      <div class="card"><h3>Past repairs</h3><div class="tbl-wrap"><table><thead><tr><th>Work order</th><th>Issue</th><th>Closed</th><th>Status</th></tr></thead><tbody><tr><td class="num">WO-24533</td><td>Kitchen sink leak</td><td>Sep 2026</td><td>${chip('released')}</td></tr></tbody></table></div></div>
    </div>

V.customer.help = () => `<div class="card" style="max-width:760px"><h3>Help & FAQ</h3>

/* ---------- Views: Contractor ---------- */
const walletStats = () => `<div class="g4">
  <div class="stat"><small>Available</small><b class="num">${fmt(W.available)} XPT</b><small>≈ RM ${fmt(W.available)}</small></div>

let evN = 0;
function render(){ $('root').innerHTML = S.screen==='login' ? renderLogin() : renderApp(); }
function go(view){ S.view=view; S.detail=false; S.drawer=false; S.pop=null; S.disputeOpen=false; S.concernOpen=false; render(); window.scrollTo(0,0); }
function signIn(role){ S.role=role; S.screen='app'; S.view='home'; S.pop=null; S.detail=false; S.drawer=false; render(); window.scrollTo(0,0); }
const _event = event;
event = function(text,to,key){ _event(text,to,key); EVENTS[0].n = ++evN; };

/* ---------- Actions ---------- */
const ACT = {
  collapse(){ S.collapsed=!S.collapsed; try{localStorage.setItem('xpt-sb',S.collapsed?'1':'0');}catch(e){} },
  openDrawer(){ S.drawer=true; }, closeDrawer(){ S.drawer=false; },
  bell(){ if(S.pop==='bell'){ S.pop=null; return; } S.pop='bell'; S.seenBefore = S.seen[S.role]||0; S.seen[S.role]=evN; },
  user(){ S.pop = S.pop==='user'?null:'user'; },
  signout(){ S.screen='login'; S.pop=null; S.loginRole = (S.role==='developer'||S.role==='reviewer')?'provider':S.role; if(S.loginRole==='provider') S.spRole=S.role; },
  restart(){ reset(); evN=0; toast('Demo restarted'); },
  openJob(){ S.detail=true; }, closeJob(){ S.detail=false; },
  submitReport(){ J.area=$('f-area').value; J.issue=$('f-type').value; J.desc=$('f-desc').value; J.stage='reported';
    event(`New report from Unit ${J.unit}: ${J.issue}.`, ['developer'], 'reported'); S.view='repairs'; toast('Report sent to the developer'); },
  assign(){ J.contractor=$('f-con').value; J.deadline=$('f-dl').value||J.deadline; J.amount=+$('f-amt').value; J.stage='assigned';
    event(`New job offer ${J.id}: lock ${fmt(J.amount)} XPT to accept.`, ['contractor'], 'assigned');
    event(`A contractor has been assigned to your ${J.area.toLowerCase()} repair.`, ['customer']); toast(`Work order ${J.id} sent to ${J.contractor}`); },
  lock(){ W.available-=J.amount; W.locked+=J.amount; W.tx.unshift(['Today',`Bond locked · ${J.id}`,`-${fmt(J.amount)}`]); J.stage='bonded';
    event(`${J.contractor} locked ${fmt(J.amount)} XPT on ${J.id}.`, ['developer','customer'], 'bonded'); S.view='jobs'; toast(`${fmt(J.amount)} XPT locked`); },
  decline(){ toast('For this demo, accept the offer to continue'); },
  complete(){ J.stage='completed'; event(`${J.id} is ready for inspection.`, ['developer','customer'], 'completed'); toast('Sent for inspection'); },
  toggleDispute(){ S.disputeOpen=!S.disputeOpen; }, toggleConcern(){ S.concernOpen=!S.concernOpen; },
  accept(){ J.stage='inspected'; event(`Your repair passed inspection. Please confirm you are happy.`, ['customer'], 'inspected'); event(`${J.id} passed inspection. Waiting for the customer.`, ['contractor']); toast('Work accepted. Waiting for the customer.'); },
  sendDispute(){ J.dispute={by:'developer', reason:$('f-reason').value, ask:Math.max(50,+$('f-ask').value||300)}; J.stage='disputed'; S.disputeOpen=false;
    event(`Dispute on ${J.id}: ${J.dispute.reason}.`, ['reviewer','contractor'], 'disputed'); toast('Dispute sent to the reviewer'); },
  confirm(){ J.t.confirmed = tick(); release(0, `Customer confirmed ${J.id}. Bond released.`); toast('Thanks! The bond has been released.'); },
  sendConcern(){ J.dispute={by:'customer', reason:$('f-concern').value, ask:300}; J.stage='disputed'; S.concernOpen=false;
    event(`Customer concern on ${J.id}: ${J.dispute.reason}.`, ['reviewer','contractor','developer'], 'disputed'); toast('Sent to the reviewer'); },
  reply(){ J.reply=$('f-reply').value; event(`Contractor replied on ${J.id}.`, ['reviewer'], 'reply'); toast('Reply sent to the reviewer'); },
  approve(){ const d=Math.max(0,Math.min(+$('f-ded').value||0,J.amount)); J.t.decided=tick(); release(d, `Reviewer approved a ${fmt(d)} XPT deduction on ${J.id}.`); toast('Decision saved. Funds released.'); },
  reject(){ J.t.decided=tick(); release(0, `Reviewer rejected the dispute on ${J.id}.`); toast('Dispute rejected. Full bond returned.'); }
};
function release(ded, msg){ J.ded=ded; J.stage='released'; W.locked-=J.amount; W.available+=J.amount-ded; W.reuse+=1;
  W.tx.unshift(['Today',`Bond returned · ${J.id}`,`+${fmt(J.amount-ded)}`]);
  event(msg, ['customer','developer','reviewer']); event(`${fmt(J.amount-ded)} XPT returned to your wallet from ${J.id}.`, ['contractor'], 'released'); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-nav],[data-sec],[data-lrole],[data-sprole],[data-switch],[data-filter],[data-rp],[data-cp],[data-sp]');
  if(!el){ if(S.pop && !e.target.closest('.pop')){ S.pop=null; render(); } return; }
  if(el.disabled) return;
  const d = el.dataset;
  if(d.lrole){ S.loginRole=d.lrole; render(); return; }
  if(d.sprole){ S.spRole=d.sprole; render(); return; }
  if(d.switch){ signIn(d.switch); return; }
  if(d.nav){ go(d.nav); return; }
  if(d.sec){ if(S.collapsed) return; const k=S.role+d.sec; S.secs[k] = S.secs[k]===false; render(); return; }
  if(d.filter){ S.filter=d.filter; render(); return; }
  if(d.rp){ S.rPhotos[d.rp]=!S.rPhotos[d.rp]; render(); return; }
  if(d.cp){ J.ev[d.cp]=!J.ev[d.cp]; render(); return; }
  if(d.sp){ if(d.sp==='signoff'){ J.ev.signoff=!J.ev.signoff; render(); } return; }
  if(d.act && ACT[d.act]){ if(!['bell','user'].includes(d.act)) S.pop=null; ACT[d.act](); render(); }
});
document.addEventListener('submit', e => { if(e.target.id==='loginForm'){ e.preventDefault(); signIn(S.loginRole==='provider'?S.spRole:S.loginRole); } });
document.addEventListener('input', e => {
  if(e.target.id==='q'){ S.q=e.target.value; $('jobsBody').innerHTML=jobsRows(); }
  if(e.target.id==='f-amt'){ $('amtOut').textContent=fmt(e.target.value); $('amtRm').textContent=fmt(e.target.value); }
});
document.addEventListener('keydown', e => { if(e.key==='Escape' && (S.pop||S.drawer)){ S.pop=null; S.drawer=false; render(); } });

reset(); render();
})();
</script>
</body>
</html>
